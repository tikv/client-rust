[package]
name = "tikv-client"
version = "0.4.0"
keywords = ["TiKV", "KV", "distributed-systems"]
license = "Apache-2.0"
authors = ["The TiKV Project Authors"]
repository = "https://github.com/tikv/client-rust"
description = "The Rust language implementation of TiKV client."
edition = "2021"
rust-version = "1.93.0"

[features]
default = ["prometheus"]
prometheus = ["prometheus/push", "prometheus/process"]
# Enable integration tests with a running TiKV and PD instance.
# Use $PD_ADDRS, comma separated, to set the addresses the tests use.
integration-tests = []

[lib]
name = "tikv_client"

[workspace]
members = [
    ".",
    "proto-build",
]

[dependencies]
async-recursion = "1.2"
async-trait = "0.1"
derive-new = "0.7"
either = "1.19"
fail = "0.5"
futures = { version = "0.3" }
lazy_static = "1"
log = "0.4"
pin-project = "1"
prometheus = { version = "0.14", default-features = false }
prost = "0.14"
rand = "0.10"
regex = "1"
semver = "1.0"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1"
take_mut = "0.2.2"
thiserror = "2"
tokio = { version = "1.53", features = ["sync", "rt-multi-thread", "macros"] }
tonic = { version = "0.14", features = ["tls-ring", "gzip"] }
tonic-prost = "0.14"

[dev-dependencies]
clap = { version = "4", features = ["cargo", "string"] }
env_logger = "0.11"
fail = { version = "0.5", features = ["failpoints"] }
proptest = "1"
proptest-derive = "0.9.0"
reqwest = { version = "0.13", features = ["json", "native-tls-vendored"] }
rstest = "0.28.0"
serde_json = "1"
serial_test = "3.5.0"
tempfile = "=3.27.0"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }

[[test]]
name = "failpoint_tests"
path = "tests/failpoint_tests.rs"
required-features = ["fail/failpoints"]
